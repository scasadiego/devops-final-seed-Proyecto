name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  quality:
    name: Lint, tests and security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r dev-requirements.txt

      - name: Lint with Ruff
        run: ruff check src/ tests/

      - name: Check formatting with Ruff
        run: ruff format --check src/ tests/

      - name: Create reports directory
        run: mkdir -p reports

      - name: Run tests
        run: pytest --junitxml=reports/tests.xml

      - name: Audit dependencies
        run: pip-audit -r requirements.txt -f json -o reports/pip-audit.json

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          path: reports/

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create build reports directory
        run: mkdir -p reports dist

      - name: Build Docker image
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          docker build \
            -t todo-api:${GITHUB_SHA} \
            -t todo-api:${SHORT_SHA} \
            -t todo-api:latest \
            .

          {
            echo "image=todo-api"
            echo "tag_sha=${GITHUB_SHA}"
            echo "tag_short_sha=${SHORT_SHA}"
            echo "tag_latest=latest"
            echo "commit=${GITHUB_SHA}"
            echo "branch=${GITHUB_REF_NAME}"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > reports/docker-build.txt

      - name: Save Docker image artifact
        run: docker save todo-api:${{ github.sha }} -o dist/todo-api-${{ github.sha }}.tar

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-${{ github.sha }}
          path: dist/todo-api-${{ github.sha }}.tar

      - name: Upload build report
        uses: actions/upload-artifact@v4
        with:
          name: docker-build-report
          path: reports/docker-build.txt
